  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

\n}\n/* cyrillic-ext */\n@font-face {\n  font-family: 'IBM Plex Mono';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"006fa481-ed85-4c0a-a3d5-a67c75f44085\") format('woff2');\n  unicode-range: U+0460-052F, U+1C80-1C8A, U+20B4, U+2DE0-2DFF, U+A640-A69F, U+FE2E-FE2F;\n}\n/* cyrillic */\n@font-face {\n  font-family: 'IBM Plex Mono';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"ff8aa513-5564-4780-9673-df02abb4d585\") format('woff2');\n  unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;\n}\n/* vietnamese */\n@font-face {\n  font-family: 'IBM Plex Mono';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"3a74981f-0147-43f5-baca-e6804d7fe78b\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'IBM Plex Mono';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"5b42d63d-f047-4e84-930b-e9a7e3f701d0\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'IBM Plex Mono';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"97c95b9c-3fd1-409c-88ec-0ba45558daf1\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Instrument Sans';\n  font-style: italic;\n  font-weight: 400 700;\n  font-stretch: 100%;\n  font-display: swap;\n  src: url(\"e84f49d3-84c9-4a4b-b834-e128a49e30bc\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Instrument Sans';\n  font-style: italic;\n  font-weight: 400 700;\n  font-stretch: 100%;\n  font-display: swap;\n  src: url(\"2ade6407-1150-4acc-ab27-3a56df3b2272\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Instrument Sans';\n  font-style: normal;\n  font-weight: 400 700;\n  font-stretch: 100%;\n  font-display: swap;\n  src: url(\"10d50f18-e8a4-4fba-a51f-2c707856c975\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Instrument Sans';\n  font-style: normal;\n  font-weight: 400 700;\n  font-stretch: 100%;\n  font-display: swap;\n  src: url(\"7bd66029-ad39-4306-be40-0a9449d6f6c4\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>/* ---------------------------------------------------------------------------\n * Dark Factory design tokens — ADR-0033.\n *\n * Every colour used anywhere in the product is defined here, once, as a\n * semantic name. Nothing downstream is allowed to name a raw colour: the\n * `@theme` reset at the bottom of this file deletes Tailwind's default\n * palette, so `bg-gray-800` is not a class that exists. That is deliberate —\n * a design system enforced only by review is a design system that drifts.\n *\n * Two themes. Dark is primary (the product is a console a lead lives in);\n * light is a complete, equally-finished second theme, not an afterthought.\n * Light lives on `:root`, dark on `.dark`, so a subtree can be flipped by\n * adding the class — which is how the showcase renders both at once.\n *\n * Colours are authored in OKLCH. Perceptual lightness is the axis that\n * contrast lives on, so holding L fixed across a row of hues gives a set of\n * status colours that genuinely read as equally loud.\n * ------------------------------------------------------------------------ */\n\n:root,\n.light {\n  /* -- Typography -----------------------------------------------------------\n   * The package names the font tokens; the app supplies the actual faces\n   * (Next's next/font sets --font-instrument-sans / --font-ibm-plex-mono).\n   * The fallbacks make the package render sensibly with no app wiring.\n   */\n  --font-sans: var(--font-instrument-sans), ui-sans-serif, system-ui,\n    -apple-system, \"Segoe UI\", Roboto, sans-serif;\n  --font-mono: var(--font-ibm-plex-mono), ui-monospace, \"SF Mono\",\n    \"Cascadia Mono\", Menlo, Consolas, monospace;\n\n  /* -- Neutral ramp: warm, hue 70 ------------------------------------------\n   * Low chroma, never zero. Pure gray reads as \"unfinished screen\"; a warm\n   * ramp reads as ink on paper and lets the cool iris accent sit against it\n   * without either fighting the other.\n   */\n  --df-n-0: oklch(0.995 0.002 70);\n  --df-n-25: oklch(0.983 0.003 70);\n  --df-n-50: oklch(0.972 0.004 70);\n  --df-n-100: oklch(0.948 0.005 70);\n  --df-n-200: oklch(0.906 0.006 70);\n  --df-n-300: oklch(0.848 0.007 70);\n  --df-n-400: oklch(0.712 0.008 70);\n  --df-n-500: oklch(0.582 0.009 70);\n  --df-n-600: oklch(0.487 0.010 70);\n  --df-n-700: oklch(0.392 0.010 70);\n  --df-n-800: oklch(0.298 0.009 70);\n  --df-n-900: oklch(0.222 0.008 70);\n  --df-n-950: oklch(0.168 0.007 70);\n  --df-n-1000: oklch(0.128 0.006 70);\n\n  /* -- Surfaces ------------------------------------------------------------- */\n  --surface-page: var(--df-n-50);\n  --surface-card: var(--df-n-0);\n  --surface-raised: oklch(1 0 0);\n  --surface-overlay: var(--df-n-0);\n  --surface-sunken: var(--df-n-100);\n  --border: var(--df-n-200);\n  --border-strong: var(--df-n-300);\n  /* The dim behind a dialog or sheet. A token, not an inline colour: it is\n   * the one surface that has to differ per theme by opacity as well as hue. */\n  --scrim: oklch(0.222 0.008 70 / 0.42);\n  /* A form control's boundary is the only thing identifying it, so this one\n   * carries a real 3:1 obligation (WCAG 1.4.11) and is heavier than the\n   * hairlines used for grouping. */\n  --border-control: oklch(0.618 0.010 70);\n\n  /* -- Text ----------------------------------------------------------------- */\n  --text-primary: var(--df-n-900);\n  --text-secondary: var(--df-n-600);\n  --text-muted: oklch(0.528 0.010 70);\n  --text-inverse: var(--df-n-25);\n\n  /* -- Accent: iris. Actions the user must take, and nothing else. ---------- */\n  --accent: oklch(0.512 0.196 285);\n  --accent-hover: oklch(0.452 0.190 285);\n  --accent-text: oklch(0.470 0.196 285);\n  --accent-fill: oklch(0.955 0.028 285);\n  --accent-border: oklch(0.790 0.090 285);\n  --accent-fg: oklch(0.995 0.005 285);\n  --accent-ring: oklch(0.585 0.185 285);\n\n  /* -- Stage status ---------------------------------------------------------\n   * pending / running are quiet; passed is calm; parked and over-budget are\n   * the accent's family because they are the two states that mean \"a person\n   * is required\"; failed is red and deliberately nothing like parked —\n   * \"the machine broke\" and \"the agent is waiting on you\" are different days.\n   */\n  --status-pending-fill: var(--df-n-100);\n  --status-pending-border: var(--df-n-300);\n  --status-pending-text: oklch(0.500 0.009 70);\n\n  --status-running-fill: oklch(0.952 0.020 245);\n  --status-running-border: oklch(0.790 0.060 245);\n  --status-running-text: oklch(0.480 0.110 245);\n\n  --status-passed-fill: oklch(0.952 0.030 150);\n  --status-passed-border: oklch(0.780 0.080 150);\n  --status-passed-text: oklch(0.442 0.105 150);\n\n  --status-parked-fill: oklch(0.955 0.028 285);\n  --status-parked-border: oklch(0.790 0.090 285);\n  --status-parked-text: oklch(0.470 0.196 285);\n\n  --status-failed-fill: oklch(0.955 0.028 27);\n  --status-failed-border: oklch(0.800 0.090 27);\n  --status-failed-text: oklch(0.478 0.170 27);\n\n  --status-over-budget-fill: oklch(0.955 0.030 330);\n  --status-over-budget-border: oklch(0.795 0.095 330);\n  --status-over-budget-text: oklch(0.470 0.185 330);\n\n  /* -- Spec layers ----------------------------------------------------------\n   * Five quiet hues at a fraction of the status chroma, so a row of layer\n   * badges reads as a legend rather than as five competing alerts. `other`\n   * is the fallback: `layer` is an open string in specdiff.schema.json —\n   * customers' standards servers declare their own layers.\n   */\n  --layer-product-fill: oklch(0.948 0.022 15);\n  --layer-product-border: oklch(0.855 0.048 15);\n  --layer-product-text: oklch(0.462 0.098 15);\n\n  --layer-api-fill: oklch(0.948 0.028 70);\n  --layer-api-border: oklch(0.850 0.058 70);\n  --layer-api-text: oklch(0.452 0.078 70);\n\n  --layer-data-fill: oklch(0.948 0.024 150);\n  --layer-data-border: oklch(0.848 0.050 150);\n  --layer-data-text: oklch(0.442 0.072 150);\n\n  --layer-infra-fill: oklch(0.948 0.022 215);\n  --layer-infra-border: oklch(0.850 0.046 215);\n  --layer-infra-text: oklch(0.452 0.075 215);\n\n  --layer-ui-fill: oklch(0.948 0.024 295);\n  --layer-ui-border: oklch(0.855 0.050 295);\n  --layer-ui-text: oklch(0.462 0.100 295);\n\n  --layer-other-fill: var(--df-n-100);\n  --layer-other-border: var(--df-n-300);\n  --layer-other-text: oklch(0.500 0.009 70);\n\n  /* -- Diff -----------------------------------------------------------------\n   * conflict is the loudest thing the system can draw. It is the one place\n   * we spend maximum chroma, because \"this contradicts the rule you set in\n   * March\" is the single most valuable sentence the product says.\n   */\n  --diff-added-fill: oklch(0.948 0.038 150);\n  --diff-added-border: oklch(0.780 0.085 150);\n  --diff-added-text: oklch(0.442 0.105 150);\n  --diff-added-marker: oklch(0.560 0.130 150);\n\n  --diff-removed-fill: oklch(0.950 0.032 27);\n  --diff-removed-border: oklch(0.800 0.090 27);\n  --diff-removed-text: oklch(0.478 0.170 27);\n  --diff-removed-marker: oklch(0.585 0.180 27);\n\n  --diff-changed-fill: oklch(0.955 0.040 85);\n  --diff-changed-border: oklch(0.820 0.085 85);\n  --diff-changed-text: oklch(0.452 0.098 85);\n  --diff-changed-marker: oklch(0.612 0.128 85);\n\n  --diff-conflict-fill: oklch(0.930 0.058 340);\n  --diff-conflict-border: oklch(0.640 0.200 340);\n  --diff-conflict-text: oklch(0.448 0.215 340);\n  --diff-conflict-marker: oklch(0.560 0.245 340);\n\n  /* -- Server health --------------------------------------------------------\n   * unreachable is neutral on purpose: a server we cannot reach is usually a\n   * network fact, not a fault, and colouring it red trains people to ignore\n   * red.\n   */\n  --server-conformant-fill: oklch(0.952 0.030 150);\n  --server-conformant-border: oklch(0.780 0.080 150);\n  --server-conformant-text: oklch(0.442 0.105 150);\n\n  --server-degraded-fill: oklch(0.955 0.040 85);\n  --server-degraded-border: oklch(0.820 0.085 85);\n  --server-degraded-text: oklch(0.452 0.098 85);\n\n  --server-unreachable-fill: var(--df-n-100);\n  --server-unreachable-border: var(--df-n-400);\n  --server-unreachable-text: oklch(0.500 0.009 70);\n\n  /* -- Focus --------------------------------------------------------------- */\n  --focus-ring: var(--accent-ring);\n  --focus-ring-offset: var(--surface-card);\n\n  /* -- Selection ----------------------------------------------------------- */\n  --selection-bg: oklch(0.900 0.060 285);\n  --selection-fg: var(--text-primary);\n\n  /* -- shadcn compatibility aliases ----------------------------------------\n   * shadcn components are copied into this package and restyled, but they\n   * are copied from upstream and re-copied when upstream fixes a bug. These\n   * aliases mean an unmodified upstream component still lands on our palette\n   * instead of on a colour nobody chose.\n   */\n  --background: var(--surface-page);\n  --foreground: var(--text-primary);\n  --card: var(--surface-card);\n  --card-foreground: var(--text-primary);\n  --popover: var(--surface-overlay);\n  --popover-foreground: var(--text-primary);\n  --primary: var(--accent);\n  --primary-foreground: var(--accent-fg);\n  --secondary: var(--df-n-100);\n  --secondary-foreground: var(--text-primary);\n  --muted: var(--df-n-100);\n  --muted-foreground: var(--text-muted);\n  --destructive: oklch(0.545 0.190 27);\n  --destructive-foreground: oklch(0.995 0.005 27);\n  --input: var(--border-control);\n  --ring: var(--focus-ring);\n}\n\n.dark {\n  /* Dark is the primary theme. The page is a warm near-black — ink, not\n   * charcoal — and the surface ramp climbs by lightness only, so elevation\n   * reads without a single shadow being drawn. */\n  --surface-page: oklch(0.158 0.006 70);\n  --surface-card: oklch(0.196 0.007 70);\n  --surface-raised: oklch(0.232 0.008 70);\n  --surface-overlay: oklch(0.226 0.008 70);\n  --surface-sunken: oklch(0.132 0.005 70);\n  --scrim: oklch(0.098 0.004 70 / 0.72);\n  --border: oklch(0.288 0.008 70);\n  --border-strong: oklch(0.392 0.009 70);\n  --border-control: oklch(0.500 0.010 70);\n\n  --text-primary: oklch(0.958 0.004 70);\n  --text-secondary: oklch(0.790 0.007 70);\n  --text-muted: oklch(0.648 0.008 70);\n  --text-inverse: oklch(0.168 0.007 70);\n\n  --accent: oklch(0.706 0.158 285);\n  --accent-hover: oklch(0.762 0.150 285);\n  --accent-text: oklch(0.792 0.126 285);\n  --accent-fill: oklch(0.272 0.062 285);\n  --accent-border: ----------------------\n * Shape, elevation and motion.\n * ------------------------------------------------------------------------ */\n\n:root,\n.light {\n  /* Three radii, no more. Controls, containers, pills. */\n  --radius-control: 0.375rem;\n  --radius-card: 0.625rem;\n  --radius-pill: 9999px;\n\n  /* Two levels of elevation. Anything that needs a third needs a different\n   * layout instead. In dark the ramp does the lifting, so the shadows are\n   * near-invisible and a hairline ring carries the edge. */\n  --shadow-raised: 0 1px 2px oklch(0.222 0.008 70 / 0.06),\n    0 1px 1px oklch(0.222 0.008 70 / 0.04);\n  --shadow-overlay: 0 8px 28px oklch(0.222 0.008 70 / 0.12),\n    0 2px 6px oklch(0.222 0.008 70 / 0.08);\n\n  /* Fast is for state (hover, press, check). Slow is for layout (a sheet\n   * arriving, a section opening). Nothing in between, so nothing has to be\n   * argued about. */\n  --motion-fast: 120ms;\n  --motion-slow: 260ms;\n  --motion-ease: cubic-bezier(0.22, 1, 0.36, 1);\n}\n\n.dark {\n  --shadow-raised: 0 1px 2px oklch(0 0 0 / 0.4);\n  --shadow-overlay: 0 12px 36px oklch(0 0 0 / 0.55), 0 2px 8px oklch(0 0 0 / 0.4);\n}\n\n/* The reduced-motion rule is global and unconditional: a user who has asked\n * their OS for less motion gets it everywhere, without each component having\n * to remember. Transitions collapse to ~nothing rather than to `none`, so\n * transitionend handlers still fire. */\n@media (prefers-reduced-motion: reduce) {\n  :root {\n    --motion-fast: 1ms;\n    --motion-slow: 1ms;\n  }\n\n  *,\n  *::before,\n  *::after {\n    animation-duration: 1ms !important;\n    animation-iteration-count: 1 !important;\n    transition-duration: 1ms !important;\n    scroll-behavior: auto !important;\n  }\n}\n\n::selection {\n  background-color: var(--selection-bg);\n  color: var(--selection-fg);\n}\n\n/* ---------------------------------------------------------------------------\n * Tailwind theme binding.\n *\n * `--color-*: initial` deletes Tailwind's default palette outright. After\n * this, `bg-gray-800` and `text-red-500` are not classes — the build fails\n * to produce them and the colour simply does not appear. This is the\n * tokens-only policy of ADR-0033, enforced by the compiler rather than by a\n * reviewer noticing.\n *\n * `inline` matters: without it the generated `--color-*` variables would be\n * computed once at `:root` and would not re-resolve under `.dark`.\n * ------------------------------------------------------------------------ */\n\n@theme inline {\n  --color-*: initial;\n\n  --color-transparent: transparent;\n  --color-current: currentColor;\n  --color-inherit: inherit;\n\n  --color-page: var(--surface-page);\n  --color-card: var(--surface-card);\n  --color-raised: var(--surface-raised);\n  --color-overlay: var(--surface-overlay);\n  --color-sunken: var(--surface-sunken);\n  --color-border: var(--border);\n  --color-border-strong: var(--border-strong);\n  --color-scrim: var(--scrim);\n  --color-border-control: var(--border-control);\n\n  --color-primary: var(--text-primary);\n  --color-secondary: var(--text-secondary);\n  --color-muted: var(--text-muted);\n  --color-inverse: var(--text-inverse);\n\n  --color-accent: var(--accent);\n  --color-accent-hover: var(--accent-hover);\n  --color-accent-text: var(--accent-text);\n  --color-accent-fill: var(--accent-fill);\n  --color-accent-border: var(--accent-border);\n  --color-accent-fg: var(--accent-fg);\n  --color-accent-ring: var(--accent-ring);\n\n  --color-danger: var(--destructive);\n  --color-danger-fg: var(--destructive-foreground);\n\n  --color-status-pending-fill: var(--status-pending-fill);\n  --color-status-pending-border: var(--status-pending-border);\n  --color-status-pending-text: var(--status-pending-text);\n  --color-status-running-fill: var(--status-running-fill);\n  --color-status-running-border: var(--status-running-border);\n  --color-status-running-text: var(--status-running-text);\n  --color-status-passed-fill: var(--status-passed-fill);\n  --color-status-passed-border: var(--status-passed-border);\n  --color-status-passed-text: var(--status-passed-text);\n  --color-status-parked-fill: var(--status-parked-fill);\n  --color-status-parked-border: var(--status-parked-border);\n  --color-status-parked-text: var(--status-parked-text);\n  --color-status-failed-fill: var(--status-failed-fill);\n  --color-status-failed-border: var(--status-failed-border);\n  --color-status-failed-text: var(--status-failed-text);\n  --color-status-over-budget-fill: var(--status-over-budget-fill);\n  --color-status-over-budget-border: var(--status-over-budget-border);\n  --color-status-over-budget-text: var(--status-over-budget-text);\n\n  --color-layer-product-fill: var(--layer-product-fill);\n  --color-layer-product-border: var(--layer-product-border);\n  --color-layer-product-text: var(--layer-product-text);\n  --color-layer-api-fill: var(--layer-api-fill);\n  --color-layer-api-border: var(--layer-api-border);\n  --color-layer-api-text: var(--layer-api-text);\n  --color-layer-data-fill: var(--layer-data-fill);\n  --color-layer-data-border: var(--layer-data-border);\n  --color-layer-data-text: var(--layer-data-text);\n  --color-layer-infra-fill: var(--layer-infra-fill);\n  --color-layer-infra-border: var(--layer-infra-border);\n  --color-layer-infra-text: var(--layer-infra-text);\n  --color-layer-ui-fill: var(--layer-ui-fill);\n  --color-layer-ui-border: var(--layer-ui-border);\n  --color-layer-ui-text: var(--layer-ui-text);\n  --color-layer-other-fill: var(--layer-other-fill);\n  --color-layer-other-border: var(--layer-other-border);\n  --color-layer-other-text: var(--layer-other-text);\n\n  --color-diff-added-fill: var(--diff-added-fill);\n  --color-diff-added-border: var(--diff-added-border);\n  --color-diff-added-text: var(--diff-added-text);\n  --color-diff-added-marker: var(--diff-added-marker);\n  --color-diff-removed-fill: var(--diff-removed-fill);\n  --color-diff-removed-border: var(--diff-removed-border);\n  --color-diff-removed-text: var(--diff-removed-text);\n  --color-diff-removed-marker: var(--diff-removed-marker);\n  --color-diff-changed-fill: var(--diff-changed-fill);\n  --color-diff-changed-border: var(--diff-changed-border);\n  --color-diff-changed-text: var(--diff-changed-text);\n  --color-diff-changed-marker: var(--diff-changed-marker);\n  --color-diff-conflict-fill: var(--diff-conflict-fill);\n  --color-diff-conflict-border: var(--diff-conflict-border);\n  --color-diff-conflict-text: var(--diff-conflict-text);\n  --color-diff-conflict-marker: var(--diff-conflict-marker);\n\n  --color-server-conformant-fill: var(--server-conformant-fill);\n  --color-server-conformant-border: var(--server-conformant-border);\n  --color-server-conformant-text: var(--server-conformant-text);\n  --color-server-degraded-fill: var(--server-degraded-fill);\n  --color-server-degraded-border: var(--server-degraded-border);\n  --color-server-degraded-text: var(--server-degraded-text);\n  --color-server-unreachable-fill: var(--server-unreachable-fill);\n  --color-server-unreachable-border: var(--server-unreachable-border);\n  --color-server-unreachable-text: var(--server-unreachable-text);\n\n  --font-sans: var(--font-sans);\n  --font-mono: var(--font-mono);\n\n  --radius-control: var(--radius-control);\n  --radius-card: var(--radius-card);\n  --radius-pill: var(--radius-pill);\n\n  --shadow-raised: var(--shadow-raised);\n  --shadow-overlay: var(--shadow-overlay);\n\n  --ease-quiet: var(--motion-ease);\n\n  /* A dense editorial scale. 13px is the working size: this is a console,\n   * and the reading distance is a person leaning in, not a landing page. */\n  --text-2xs: 0.6875rem;\n  --text-2xs--line-height: 1.45;\n  --text-2xs--letter-spacing: 0.01em;\n  --text-xs: 0.75rem;\n  --text-xs--line-height: 1.45;\n  --text-sm: 0.8125rem;\n  --text-sm--line-height: 1.5;\n  --text-base: 0.875rem;\n  --text-base--line-height: 1.55;\n  --text-md: 1rem;\n  --text-md--line-height: 1.6;\n  --text-lg: 1.125rem;\n  --text-lg--line-height: 1.4;\n  --text-lg--letter-spacing: -0.01em;\n  --text-xl: 1.375rem;\n  --text-xl--line-height: 1.3;\n  --text-xl--letter-spacing: -0.015em;\n  --text-2xl: 1.75rem;\n  --text-2xl--line-height: 1.2;\n  --text-2xl--letter-spacing: -0.02em;\n  --text-3xl: 2.25rem;\n  --text-3xl--line-height: 1.12;\n  --text-3xl--letter-spacing: -0.025em;\n}\n\n/* Motion utilities, so components name the intent rather than a number. */\n@utility motion-fast {\n  transition-duration: var(--motion-fast);\n  transition-timing-function: var(--motion-ease);\n}\n\n@utility motion-slow {\n  transition-duration: var(--motion-slow);\n  transition-timing-function: var(--motion-ease);\n}\n\n/* Tabular figures for anything a person compares down a column: costs,\n * token counts, durations. */\n@utility tnum {\n  font-variant-numeric: tabular-nums;\n}\n\n/* ---------------------------------------------------------------------------\n * Enter/exit animations for the overlay family.\n *\n * Layout motion is `--motion-slow` on the way in and `--motion-fast` on the\n * way out: arriving should feel considered, leaving should feel immediate.\n * The reduced-motion block above collapses both without any of these needing\n * to know about it.\n * ------------------------------------------------------------------------ */\n\n@keyframes df-fade-in { from { opacity: 0; } }\n@keyframes df-fade-out { to { opacity: 0; } }\n@keyframes df-pop-in { from { opacity: 0; transform: scale(0.97); } }\n@keyframes df-pop-out { to { opacity: 0; transform: scale(0.97); } }\n@keyframes df-slide-in-right { from { transform: translateX(100%); } }\n@keyframes df-slide-out-right { to { transform: translateX(100%); } }\n@keyframes df-slide-in-left { from { transform: translateX(-100%); } }\n@keyframes df-slide-out-left { to { transform: translateX(-100%); } }\n@keyframes df-slide-in-bottom { from { transform: translateY(100%); } }\n@keyframes df-slide-out-bottom { to { transf  border: 2px solid var(--diff-conflict-border); border-radius: 10px; background: var(--diff-conflict-fill); color: var(--diff-conflict-text)\">\n                        <h4 style=\"margin: 0; display: flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase\">\n                          <svg width=\"14\" height=\"14\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"var(--diff-conflict-marker)\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m21.7 18-8-14a2 2 0 0 0-3.4 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.7-3Z\"><\u002Fpath><path d=\"M12 9v4\"><\u002Fpath><path d=\"M12 17h.01\"><\u002Fpath><\u002Fsvg>\n                          1 conflict\n                        <\u002Fh4>\n                        <div style=\"display: flex; flex-direction: column; gap: 4px\">\n                          <div style=\"display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 11px\">\n                            <span style=\"font-family: var(--font-mono); background: var(--surface-sunken); color: var(--text-secondary); border-radius: 6px; padding: 1px 4px\" title=\"01BX5ZZKBKACTAV9WEVGEMMVRZ\">01BX…EMMVRZ<\u002Fspan>\n                            <span style=\"opacity: 0.8\">decided 14 Mar 10:22 UTC<\u002Fspan>\n                          <\u002Fdiv>\n                          <p style=\"margin: 0; font-size: 13px; color: var(--text-primary)\">Renewal proceeds regardless of account standing.<\u002Fp>\n                          <p style=\"margin: 0; font-size: 12px; opacity: 0.9\">This amendment blocks renewal for delinquent accounts, which directly contradicts this rule. One of the two has to go.<\u002Fp>\n                        <\u002Fdiv>\n                      <\u002Fsection>\n\n                      <div style=\"border: 1px solid var(--border); border-radius: 10px; overflow: hidden\">\n                        <div style=\"display: flex; gap: 12px; padding: 10px 12px; border-bottom: 1px solid var(--border); background: var(--diff-added-fill); color: var(--diff-added-text)\">\n                          <span style=\"width: 12px; flex: none; text-align: center; font-family: var(--font-mono); font-weight: 600; color: var(--diff-added-marker)\">+<\u002Fspan>\n                          <div style=\"min-width: 0; flex: 1; display: flex; flex-direction: column; gap: 4px\">\n                            <div style=\"display: flex; flex-wrap: wrap; align-items: center; gap: 6px\">\n                              <span style=\"font-family: var(--font-mono); font-size: 11px; opacity: 0.8\">new:0<\u002Fspan>\n                              <span style=\"display: inline-flex; padding: 1px 6px; border: 1px solid var(--layer-data-border); border-radius: 9999px; background: var(--layer-data-fill); color: var(--layer-data-text); font-family: var(--font-mono); font-size: 11px; white-space: nowrap\">data<\u002Fspan>\n                              <span style=\"font-size: 11px; opacity: 0.7\">constraint<\u002Fspan>\n                            <\u002Fdiv>\n                            <p style=\"margin: 0; font-size: 13px; color: var(--text-primary)\">An account is delinquent 30 days after an invoice passes its due date unpaid.<\u002Fp>\n                            <p style=\"margin: 0; font-size: 12px; color: var(--text-secondary)\">The grace window was assumed in three places and written down in none. Naming it as its own node is what lets the renewal rule depend on it instead of restating it.<\u002Fp>\n                          <\u002Fdiv>\n                        <\u002Fdiv>\n                        <div style=\"display: flex; gap: 12px; padding: 10px 12px; border-bottom: 1px solid var(--border); background: var(--diff-changed-fill); color: var(--diff-changed-text)\">\n                          <span style=\"width: 12px; flex: none; text-align: center; font-family: var(--font-mono); font-weight: 600; color: var(--diff-chan  11px; opacity: 0.8\" title=\"01CQZ0PGCC4KVFPNAJ5R6T9HTM\">01CQ…6T9HTM<\u002Fspan>\n                              <span style=\"display: inline-flex; padding: 1px 6px; border: 1px solid var(--layer-data-border); border-radius: 9999px; background: var(--layer-data-fill); color: var(--layer-data-text); font-family: var(--font-mono); font-size: 11px; white-space: nowrap\">data<\u002Fspan>\n                            <\u002Fdiv>\n                            <p style=\"margin: 0; font-size: 13px; color: var(--text-primary)\">Delinquency is evaluated against the billing ledger, and fails closed when the ledger is unreachable.<\u002Fp>\n                            <p style=\"margin: 0; font-size: 12px; color: var(--text-secondary)\">Fail-closed was your answer above. Recorded here rather than in the renewal rule, because every reader of delinquency needs it.<\u002Fp>\n                          <\u002Fdiv>\n                        <\u002Fdiv>\n                        <div style=\"display: flex; gap: 12px; padding: 10px 12px; background: var(--diff-removed-fill); color: var(--diff-removed-text)\">\n                          <span style=\"width: 12px; flex: none; text-align: center; font-family: var(--font-mono); font-weight: 600; color: var(--diff-removed-marker)\">−<\u002Fspan>\n                          <div style=\"min-width: 0; flex: 1; display: flex; flex-direction: column; gap: 4px\">\n                            <div style=\"display: flex; flex-wrap: wrap; align-items: center; gap: 6px\">\n                              <span style=\"font-family: var(--font-mono); font-size: 11px; opacity: 0.8\" title=\"01BX5ZZKBKACTAV9WEVGEMMVRZ\">01BX…EMMVRZ<\u002Fspan>\n                              <span style=\"display: inline-flex; padding: 1px 6px; border: 1px solid var(--layer-product-border); border-radius: 9999px; background: var(--layer-product-fill); color: var(--layer-product-text); font-family: var(--font-mono); font-size: 11px; white-space: nowrap\">product<\u002Fspan>\ hite-space: nowrap\" style-hover=\"color: var(--text-primary)\">offline<\u002Fbutton>\n      <button type=\"button\" sc-camel-on-click=\"{{ setEmpty }}\" style=\"height: 22px; padding: 0 8px; border: 1px solid var(--border); border-radius: 6px; background: var(--surface-card); color: var(--text-secondary); font-size: 11px; cursor: pointer; white-space: nowrap\" style-hover=\"color: var(--text-primary)\">new conversation<\u002Fbutton>\n    <\u002Fdiv>\n    <span style=\"font-size: 11px; color: var(--text-muted)\">showing: {{ scenarioLabel }}<\u002Fspan>\n    <\u002Fsc-if>\n    <sc-if value=\"{{ onProjects }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"display: flex; align-items: center; gap: 2px\">\n      <button type=\"button\" sc-camel-on-click=\"{{ setProjectsPopulated }}\" style=\"height: 22px; padding: 0 8px; border: 1px solid var(--border); border-radius: 6px; background: var(--surface-card); color: var(--text-secondary); font-size: 11px; cursor: pointer; white-space: nowrap\" style-hover=\"color: var(--text-primary)\">roster<\u002Fbutton>\n      <button type=\"button\" sc-camel-on-click=\"{{ setProjectsEmpty }}\" style=\"height: 22px; padding: 0 8px; border: 1px solid var(--border); border-radius: 6px; background: var(--surface-card); color: var(--text-secondary); font-size: 11px; cursor: pointer; white-space: nowrap\" style-hover=\"color: var(--text-primary)\">empty org<\u002Fbutton>\n      <button type=\"button\" sc-camel-on-click=\"{{ setOfflineState }}\" style=\"height: 22px; padding: 0 8px; border: 1px solid var(--border); border-radius: 6px; background: var(--surface-card); color: var(--text-secondary); font-size: 11px; cursor: pointer; white-space: nowrap\" style-hover=\"color: var(--text-primary)\">offline<\u002Fbutton>\n      <button type=\"button\" sc-camel-on-click=\"{{ setSettled }}\" style=\"height: 22px; padding: 0 8px; border: 1px solid var(--border); border-radius: 6px; background: var(--surface-card); color: var(--text-secondary); font-size: 11px; cursor: pointer; white-space: nowrap\" style-hover=\"color: var(--text-primary)\">online<\u002Fbutton>\n    <\u002Fdiv>\n    <\u002Fsc-if>\n    <sc-if value=\"{{ onSpecs }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"display: flex; align-items: center; gap: 2px\">\n      <button type=\"button\" sc-camel-on-click=\"{{ setGraphBrowse }}\" style=\"height: 22px; padding: 0 8px; border: 1px solid var(--border); border-radius: 6px; background: var(--surface-card); color: var(--text-secondary); font-size: 11px; cursor: pointer; white-space: nowrap\" style-hover=\"color: var(--text-primary)\">browse<\u002Fbutton>\n      <button type=\"button\" sc-camel-on-click=\"{{ setGraphDiff }}\" style=\"height: 22px; padding: 0 8px; border: 1px solid var(--border); border-radius: 6px; background: var(--surface-card); color: var(--text-secondary); font-size: 11px; cursor: pointer; white-space: nowrap\" style-hover=\"color: var(--text-primary)\">snapshot diff<\u002Fbutton>\n    <\u002Fdiv>\n    <\u002Fsc-if>\n    <sc-if value=\"{{ onAmendments }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"display: flex; align-items: center; gap: 2px\">\n      <button type=\"button\" sc-camel-on-click=\"{{ setAmendmentsQueue }}\" style=\"height: 22px; padding: 0 8px; border: 1px solid var(--border); border-radius: 6px; background: var(--surface-card); color: var(--text-secondary); font-size: 11px; cursor: pointer; white-space: nowrap\" style-hover=\"color: var(--text-primary)\">queue<\u002Fbutton>\n      <button type=\"button\" sc-camel-on-click=\"{{ setAmendmentsEmpty }}\" style=\"height: 22px; padding: 0 8px; border: 1px solid var(--border); border-radius: 6px; background: var(--surface-card); color: var(--text-secondary); font-size: 11px; cursor: pointer; white-space: nowrap\" style-hover=\"color: var(--text-primary)\">nothing awaiting<\u002Fbutton>\n    <\u002Fdiv>\n    <\u002Fsc-if>\n    <sc-if value=\"{{ onServers }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"display: flex; align-items: center; gap: 2px\">\n      <button type=\"button\" sc-camel-on-click=\"{{ setServersConnected }}\" style=\"height: 22px; padding: 0 8px; border: 1px solid var(--border); border-radius: 6px; background: var(--surface-card); color: var(--text-secondary); font-size: 11px; cursor: pointer; white-space: nowrap\" style-hover=\"color: var(--text-primary)\">connected<\u002Fbutton>\n      <button type=\"button\" sc-camel-on-click=\"{{ setServersEmpty }}\" style=\"height: 22px; padding: 0 8px; border: 1px solid var(--border); border-radius: 6px; background: var(--surface-card); color: var(--text-secondary); font-size: 11px; cursor: pointer; white-space: nowrap\" style-hover=\"color: var(--text-primary)\">nothing connected<\u002Fbutton>\n    <\u002Fdiv>\n    <\u002Fsc-if>\n    <span style=\"margin-left: auto; font-size: 11px; color: var(--text-muted)\">All eight screens · contracts in contracts.md<\u002Fspan>\n  <\u002Fdiv>\n\n<\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;: {&quot;width&quot;: 1440, &quot;height&quot;: 900}}\">\nclass Component extends DCLogic {\n  state = {\n    theme: \"dark\", screen: \"conversation\", scenario: \"settled\", decision: null, reason: \"\",\n    draft: \"\", panel: true, projectsEmpty: false, serversEmpty: false, amendmentsEmpty: false,\n    graphView: \"browse\", selectedAmendment: \"renewal\", steer: \"\", batchOrder: [\"a1\", \"a2\", \"a3\"],\n  };\n\n  componentDidMount() { this.applyTheme(this.state.theme); }\n  componentWillUnmount() { document.documentElement.classList.remove(\"dark\"); }\n\n  applyTheme(theme) {\n    const root = document.documentElement;\n    root.classList.remove(\"dark\", \"light\");\n    root.classList.add(theme);\n  }\n\n  set(scenario) {\n    this.setState({ scenario });\n  }\n\n  go(screen) {\n    this.setState({ screen });\n  }\n\n  renderVals() {\n    const s = this.state;\n    const scenario = s.scenario;\n    const labels = {\n      settled: \"amendment settled, awaiting approval\",\n      thinking: \"architect mid-turn\",\n      parked: \"a run parked on needs-human, posted here\",\n      syncing: \"optimistic write in flight\",\n      offline: \"offline, reads from the local mirror\",\n      empty: \"new conversation\",\n    };\n    return {\n      scenarioLabel: labels[scenario] ?? scenario,\n      isEmpty: scenario === \"empty\",\n      hasThread: scenario !== \"empty\",\n      isThinking: scenario === \"thinking\",\n      isParked: scenario === \"parked\",\n      isSyncing: scenario === \"syncing\",\n      isOffline: scenario === \"offline\",\n      isSynced: scenario !== \"syncing\" && scenario !== \"offline\",\n      showReply: scenario !== \"thinking\" && scenario !== \"empty\",\n      panelOpen: s.panel,\n      reason: s.reason,\n      draft: s.draft,\n      undecided: s.decision === null,\n      isApproved: s.decision === \"approved\",\n      isRejected: s.decision === \"rejected\",\n      rejectDisabled: s.reason.trim().length === 0,\n      rejectHint: s.reason.trim().length === 0 ? \"A rejection needs a reason.\" : \"Reject this amendment\",\n      setReason: (e) => this.setState({ reason: e.target.value }),\n      setDraft: (e) => this.setState({ draft: e.target.value }),\n      approve: () => this.setState({ decision: \"approved\" }),\n      reject: () => { if (this.state.reason.trim()) this.setState({ decision: \"rejected\" }); },\n      answerParked: () => this.setState({ scenario: \"settled\" }),\n      submitForm: (e) => { e.preventDefault(); },\n      send: () => this.setState({ draft: \"\", scenario: this.state.draft.trim() ? \"thinking\" : this.state.scenario }),\n      newConversation: () => this.setState({ scenario: \"empty\", decision: null, reason: \"\" }),\n      retrySync: () => this.setState({ scenario: \"syncing\" }),\n      togglePanel: () => this.setState({ panel: !this.state.panel }),\n      toggleTheme: () => {\n        const theme = this.state.theme === \"dark\" ? \"light\" : \"dark\";\n        this.applyTheme(theme);\n        this.setState({ theme });\n      },\n      screen: s.screen,\n      onProjects: s.screen === \"projects\",\n      onConversation: s.screen === \"conversation\",\n      onSpecs: s.screen === \"specs\",\n      onAmendments: s.screen === \"amendments\",\n      onBatches: s.screen === \"batches\",\n      onTeam: s.screen === \"team\",\n      onServers: s.screen === \"servers\",\n      onUsage: s.screen === \"usage\",\n      goConverse: () => this.go(\"conversation\"),\n      goProjects: () => this.go(\"projects\"),\n      goSpecs: () => this.go(\"specs\"),\n      goAmendments: () => this.go(\"amendments\"),\n      goBatches: () => this.go(\"batches\"),\n      goTeam: () => this.go(\"team\"),\n      goServers: () => this.go(\"servers\"),\n      goUsage: () => this.go(\"usage\"),\n      goStub: () => {},\n      projectsEmpty: s.projectsEmpty,\n      projectsPopulated: !s.projectsEmpty,\n      serversEmpty: s.serversEmpty,\n      serversConnected: !s.serversEmpty,\n      amendmentsEmpty: s.amendmentsEmpty,\n      amendmentsQueue: !s.amendmentsEmpty,\n      graphBrowse: s.graphView === \"browse\",\n      graphDiff: s.graphView === \"diff\",\n      steer: s.steer,\n      setSteer: (e) => this.setState({ steer: e.target.value }),\n      sendSteer: () => this.setState({ steer: \"\" }),\n      setProjectsPopulated: () => this.setState({ projectsEmpty: false }),\n      setProjectsEmpty: () => this.setState({ projectsEmpty: true }),\n      setServersConnected: () => this.setState({ serversEmpty: false }),\n      setServersEmpty: () => this.setState({ serversEmpty: true }),\n      setAmendmentsQueue: () => this.setState({ amendmentsEmpty: false }),\n      setAmendmentsEmpty: () => this.setState({ amendmentsEmpty: true }),\n      setGraphBrowse: () => this.setState({ graphView: \"browse\" }),\n      setGraphDiff: () => this.setState({ graphView: \"diff\" }),\n      setSettled: () => this.set(\"settled\"),\n      setThinking: () => this.set(\"thinking\"),\n      setParked: () => this.set(\"parked\"),\n      setSyncingState: () => this.set(\"syncing\"),\n      setOfflineState: () => this.set(\"offline\"),\n      setEmpty: () => this.setState({ scenario: \"empty\", decision: null, reason: \"\" }),\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
