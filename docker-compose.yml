services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-darkfactory}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-darkfactory}
      POSTGRES_DB: ${POSTGRES_DB:-darkfactory}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-darkfactory} -d ${POSTGRES_DB:-darkfactory}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: applies pending plain-.sql migrations (DarkFactory.Migrate,
  # docs/adr/0008 and src/DarkFactory.Data/MigrationRunner.cs) and exits.
  # `factory`/`worker` never migrate on startup — they only verify the
  # schema is current (SchemaGuard) and refuse to start otherwise, so this
  # has to complete successfully before either comes up.
  # This is the only service that gets the owner credentials. It is also
  # what provisions the restricted role's login (src/DarkFactory.Data/AppRole.cs):
  # `factory` and `worker` below connect as darkfactory_app, which has no
  # UPDATE grant on the append-only spec tables.
  migrate:
    build:
      context: .
      dockerfile: src/Dockerfile
    command: ["/app/migrate/DarkFactory.Migrate.dll"]
    environment:
      ConnectionStrings__DarkFactory: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-darkfactory};Username=${POSTGRES_USER:-darkfactory};Password=${POSTGRES_PASSWORD:-darkfactory}"
      DARKFACTORY_APP_PASSWORD: ${APP_DB_PASSWORD:-darkfactory_app}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  factory:
    build:
      context: .
      dockerfile: src/Dockerfile
    ports:
      - "5100:8080"
    environment:
      ConnectionStrings__DarkFactory: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-darkfactory};Username=darkfactory_app;Password=${APP_DB_PASSWORD:-darkfactory_app}"
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # So df.servers.register can reach a workspace server running on the
    # developer's machine rather than in this network (docs/adr/0014): the
    # reference server is deliberately not a Compose service, because a real
    # customer's workspace server never will be either.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 5s
      timeout: 5s
      retries: 10

  worker:
    build:
      context: .
      dockerfile: src/Dockerfile
    command: ["/app/engine/DarkFactory.Engine.dll"]
    environment:
      ConnectionStrings__DarkFactory: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-darkfactory};Username=darkfactory_app;Password=${APP_DB_PASSWORD:-darkfactory_app}"
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      factory:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 5s
      timeout: 5s
      retries: 10

  dashboard:
    build:
      context: ./dashboard
    ports:
      - "3000:3000"
    environment:
      FACTORY_API_URL: "http://factory:8080"
    depends_on:
      factory:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
